<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Slopix Hub Key</title>
<style>
  :root {
    --bg: #0d0c12;
    --card: #15131c;
    --main: #1e1b28;
    --outline: #302b3e;
    --text: #f0eef6;
    --muted: #a39fb3;
    --accent: #eb4060;
    --accent-hover: #f25a77;
    --good: #5fd38d;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px 16px;
    background: radial-gradient(circle at 50% -10%, #2a1520 0%, var(--bg) 55%) fixed, var(--bg);
    color: var(--text);
    font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .card {
    width: 100%;
    max-width: 440px;
    background: var(--card);
    border: 1px solid var(--outline);
    border-radius: 14px;
    padding: 28px 24px 22px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, .45);
  }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
  .mark {
    width: 40px; height: 40px; border-radius: 10px;
    display: grid; place-items: center;
    background: var(--accent); font-weight: 800; font-size: 20px;
  }
  h1 { margin: 0; font-size: 20px; line-height: 1.2; }
  .sub { margin: 0; color: var(--muted); font-size: 14px; }

  .steps { display: flex; gap: 8px; margin: 0 0 22px; padding: 0; list-style: none; }
  .steps li {
    flex: 1; padding: 8px 6px; border-radius: 8px; text-align: center;
    background: var(--main); border: 1px solid var(--outline);
    color: var(--muted); font-size: 13px; font-weight: 600;
  }
  .steps li.now { border-color: var(--accent); color: var(--text); }
  .steps li.done { border-color: transparent; background: rgba(95, 211, 141, .12); color: var(--good); }

  .notice {
    margin: 0 0 18px; padding: 10px 12px; border-radius: 8px;
    background: rgba(235, 64, 96, .12); border: 1px solid rgba(235, 64, 96, .4);
    font-size: 14px;
  }
  p { margin: 0 0 16px; color: var(--muted); }
  p strong { color: var(--text); font-weight: 600; }

  .hint { font-size: 13px; margin: 12px 0 0; }

  .btn {
    display: block; width: 100%; padding: 12px 16px;
    border: 0; border-radius: 8px; cursor: pointer;
    background: var(--accent); color: #fff;
    font: inherit; font-weight: 700; text-align: center; text-decoration: none;
  }
  .btn:hover { background: var(--accent-hover); }

  .key {
    display: block; width: 100%; padding: 14px 12px; margin-bottom: 12px;
    background: var(--bg); border: 1px dashed var(--good); border-radius: 8px;
    color: var(--good); font: 600 15px/1.4 ui-monospace, "Cascadia Mono", Consolas, monospace;
    text-align: center; word-break: break-all; user-select: all;
  }

  footer { margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--outline); font-size: 13px; color: var(--muted); }
  footer a { color: var(--text); }
</style>
</head>
<body>
<main class="card">
  <header>
    <div class="mark" aria-hidden="true">S</div>
    <div>
      <h1>Slopix Hub</h1>
      <p class="sub">Get your free key</p>
    </div>
  </header>

  <ol class="steps" id="steps">
    <li>Step 1</li>
    <li>Step 2</li>
    <li>Key</li>
  </ol>

  <div class="notice" id="notice" role="alert" hidden></div>
  <section id="view"></section>

  <footer>
    A key lasts <span id="hours"></span> hours and works on all your accounts.
    Need help? <a id="discord" target="_blank" rel="noopener">Join the Discord</a>.
  </footer>
</main>

<script>
const CONFIG = {
  // Your two LootLabs links, in order. Link 1's destination must be this page + "?cp=1",
  // link 2's this page + "?cp=2".
  steps: ["https://loot-link.com/s?wCo0HpWP", "https://loot-link.com/s?8xSTLR3k"],
  secret: "7WCEwbcXxO9H6UnSEjxWydpFCgyZ8w8W", // KEY_SECRET in loader.lua
  hours: 24,      // how long a key works
  minSeconds: 5,  // coming back from a step sooner than this means it was skipped
  maxMinutes: 60, // a step left open longer than this has to be started again
  discord: "https://discord.gg/s5UNS2fdPh",
};

// Keys ------------------------------------------------------------------------------------------
// hash32 must stay identical to the one in loader.lua: the hub recomputes the signature there.

function hash32(bytes, seed) {
  let h = seed >>> 0;
  for (const byte of bytes) h = Math.imul(h ^ byte, 16777619) >>> 0;
  h = Math.imul(h ^ (h >>> 16), 0x85ebca6b) >>> 0;
  h = Math.imul(h ^ (h >>> 13), 0xc2b2ae35) >>> 0;
  return (h ^ (h >>> 16)) >>> 0;
}

const hex = (n, width) => n.toString(16).toUpperCase().padStart(width, "0");

function makeKey(expiry) {
  const expiryHex = hex(expiry, 8);
  const bytes = new TextEncoder().encode(`${CONFIG.secret}|${expiryHex}`);
  return `SLOPIX-${expiryHex}-${hex(hash32(bytes, 0x811c9dc5), 8)}${hex(hash32(bytes, 0x2f6b7c3d), 8)}`;
}

// Progress, kept in this browser -------------------------------------------------------------
// { started: { 1: ms, 2: ms }, done: 0 | 1, key, expiry }. The -v2 name leaves behind keys from
// the old per-account system, which the hub no longer accepts.

const STORE = "slopix-key-v2";
// With storage blocked (cookies/site data off) progress cannot survive the trip to LootLabs, so the
// step checks are skipped instead of leaving the visitor stuck on step 1.
const storage = (() => {
  try {
    localStorage.setItem(`${STORE}-test`, "1");
    localStorage.removeItem(`${STORE}-test`);
    return true;
  } catch {
    return false;
  }
})();
function load() {
  try { return JSON.parse(localStorage.getItem(STORE)) || {}; } catch { return {}; }
}
function save() {
  try { localStorage.setItem(STORE, JSON.stringify(state)); } catch {}
}

const now = () => Math.floor(Date.now() / 1000);
let state = load();
let notice = "";

// Coming back from LootLabs: ?cp=<step>. It counts if that step was started here and not skipped.
// Landing on a step that is already done (a refresh, LootLabs sending you back twice) is ignored.
const checkpoint = Number(new URLSearchParams(location.search).get("cp"));
const alreadyDone = hasKey() || (checkpoint === 1 && state.done === 1);
if ((checkpoint === 1 || checkpoint === 2) && !alreadyDone) {
  const started = state.started && state.started[checkpoint];
  const seconds = started ? (Date.now() - started) / 1000 : NaN; // NaN passes both time checks
  if (storage && (!started || (checkpoint === 2 && state.done !== 1))) {
    notice = "Start each step with its button on this page.";
  } else if (seconds < CONFIG.minSeconds) {
    notice = "That was too quick. Finish the step on LootLabs, then it sends you back here.";
  } else if (seconds > CONFIG.maxMinutes * 60) {
    notice = "That step took too long. Start it again.";
  } else if (checkpoint === 1) {
    state.done = 1;
  } else {
    state.expiry = now() + CONFIG.hours * 3600;
    state.key = makeKey(state.expiry);
    state.done = 0;
  }
  if (state.started) delete state.started[checkpoint];
  save();
}
if (checkpoint) history.replaceState(null, "", location.pathname);

// Views -----------------------------------------------------------------------------------------

const view = document.getElementById("view");

function el(tag, props = {}, ...children) {
  const node = Object.assign(document.createElement(tag), props);
  node.append(...children);
  return node;
}

function hasKey() {
  return state.key && state.expiry > now();
}

function timeLeft() {
  const left = Math.max(0, state.expiry - now());
  return `${Math.floor(left / 3600)}h ${Math.floor(left % 3600 / 60)}m`;
}

function stepButton(step) {
  const record = () => {
    state.started = { ...state.started, [step]: Date.now() };
    save();
  };
  return el("a", {
    className: "btn", href: CONFIG.steps[step - 1], textContent: `Start step ${step}`,
    onclick: record, onauxclick: record,
  });
}

function stepOneView() {
  return [
    el("p", {}, "Two quick LootLabs steps and your key is ready. Each one brings you back here when it is done."),
    stepButton(1),
  ];
}

function stepTwoView() {
  return [
    el("p", {}, el("strong", { textContent: "Step 1 is done." }), " One more to go."),
    stepButton(2),
  ];
}

function keyView() {
  const keyBox = el("code", { className: "key", textContent: state.key });
  const copy = el("button", { className: "btn", textContent: "Copy key" });
  copy.onclick = async () => {
    try {
      await navigator.clipboard.writeText(state.key);
      copy.textContent = "Copied";
    } catch {
      getSelection().selectAllChildren(keyBox);
      copy.textContent = "Press Ctrl+C";
    }
    setTimeout(() => { copy.textContent = "Copy key"; }, 2000);
  };
  return [
    el("p", {}, "Copy your key, paste it into the Slopix Hub window and press ", el("strong", { textContent: "Check key" }), "."),
    keyBox,
    copy,
    el("p", { className: "hint", textContent: `Works on all your accounts. Expires in ${timeLeft()}, then come back here for a new one.` }),
  ];
}

function render() {
  const phase = hasKey() ? 3 : state.done === 1 ? 2 : 1;
  view.replaceChildren(...[stepOneView, stepTwoView, keyView][phase - 1]());
  document.querySelectorAll("#steps li").forEach((li, index) => {
    li.className = index + 1 < phase ? "done" : index + 1 === phase ? "now" : "";
  });
  const box = document.getElementById("notice");
  box.textContent = notice;
  box.hidden = !notice;
}

document.getElementById("hours").textContent = CONFIG.hours;
document.getElementById("discord").href = CONFIG.discord;
render();
// Keeps the countdown current and moves on once the key runs out.
setInterval(render, 60000);
</script>
</body>
</html>
